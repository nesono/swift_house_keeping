name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install prek
        run: brew install prek
      # Keep these in sync with the revs in .pre-commit-config.yaml. The prek
      # hooks for these tools are language: swift and would be built from
      # source, so install the prebuilt release binaries instead.
      - name: Install pinned SwiftLint and SwiftFormat
        env:
          SWIFTLINT_VERSION: 0.63.2
          SWIFTFORMAT_VERSION: 0.59.1
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -qo "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$bin"
          unzip -qo "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$bin"
          chmod +x "$bin/swiftlint" "$bin/swiftformat"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          swiftlint --version
          swiftformat --version
      - name: Cache prek environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The swiftlint/swiftformat hooks are language: swift and would be built
      # from source; run the pinned prebuilt binaries installed above instead.
      - name: Run hooks
        env:
          SKIP: swiftlint,swiftformat
        run: prek run --all-files --show-diff-on-failure
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: SwiftFormat
        run: swiftformat --lint .

  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
